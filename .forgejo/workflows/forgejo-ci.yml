# Forgejo-only CI for the me/blockads-android mirror. Forgejo reads
# .forgejo/workflows/ in preference to .github/workflows/ and GitHub ignores this
# directory, so upstream's workflows stay untouched and none of this reaches an
# upstream pull request.
#
# Differences from .github/workflows/ci.yml, all forced by the mu runner:
#   * No hashFiles() or runner.* in expressions (me/mu#927): the Gradle cache key
#     uses only the github context and restores the newest entry by prefix.
#   * The catthehacker ubuntu image has no Android SDK or NDK, so both are
#     installed here.
#   * The image's locale is POSIX, so javac (run by gomobile) would read the UTF-8
#     comments in the generated bindings as ASCII; the job sets a UTF-8 locale.
#
# pull_request_target runs this file from main against the PR head, so PRs whose
# branches mirror an upstream PR (and so carry no .forgejo/) still get a build.
# That runs PR code with this repo's secrets, which is fine only because every PR
# here comes from the owner's own branches.
name: Forgejo CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      TUNNEL_REPO: ${{ vars.TUNNEL_REPO }}
      NDK_VERSION: 26.1.10909125
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-linux-${{ github.sha }}
          restore-keys: |
            gradle-linux-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 ndk;${{ env.NDK_VERSION }}

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'
          cache-dependency-path: tunnel/go.sum

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: Go tests
        working-directory: tunnel
        run: go test ./...

      - name: Build Go Tunnel (tunnel.aar)
        run: ./gradlew -Ptunnel.source=local buildGoTunnel

      - name: Verify published tunnel.aar
        run: ./gradlew verifyTunnelAar

      - name: Unit tests
        run: ./gradlew -Ptunnel.source=local testDebugUnitTest

      - name: Lint
        run: ./gradlew -Ptunnel.source=local lint

      - name: Build debug APK
        run: |
          ./gradlew --stop
          ./gradlew -Ptunnel.source=local assembleDebug
